packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  multer: '2.4.0'
  deepmerge-ts: '8.0.0'
  source-map-js: '>=1.2.2'
  sharp: '>=0.35.5'
  js-yaml: '>=5.4.1'

allowBuilds:
  'unrs-resolver@1.12.2': true
  '@prisma/client': true
  'prisma': true
  '@prisma/engines': true
  '@prisma/engines@6.19.3': true
  '@scarf/scarf@1.4.0': true
  'argon2': true
  'argon2@0.41.1': true
